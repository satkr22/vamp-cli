[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-cli"
version = "0.1.5"
authors = [
  { name = "Satyam Kumar", email = "satkr2208@gmail.com" }
]
description = "VAMP-CLI is an interactive coding agent for working in a local repository. It combines a planner, a coder, model fallbacks, workspace-aware file tools, and a Docker-backed command sandbox in one terminal application. The agent can inspect and edit files, search a codebase, run commands, maintain a task list, and ask for confirmation before executing potentially dangerous operations."

readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic",
    "rich",
    "typer",
    "click",
    "orjson",
    "pytest",
    "pyyaml",
    "pathspec",
    "prompt-toolkit",
    "langchain-core",
    "langgraph",
    "langchain-litellm",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "mcp",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vamp_cli = ["*.md", "**/*.md", "**/*.yaml"]


[project.scripts]
vamp = "vamp_cli.main:start"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.urls]
Homepage = "https://github.com/satkr22/vamp-cli"
Repository = "https://github.com/satkr22/vamp-cli"